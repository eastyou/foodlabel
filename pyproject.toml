[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foodlabel"
version = "0.1.0"
description = "营养成分表解读工具：每份换算、NRV 占比、能量分级与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["营养", "营养成分表", "NRV", "热量", "健康", "初中", "练习纸", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Natural Language :: Chinese (Simplified)",
]

[project.scripts]
foodlabel = "foodlabel.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/foodlabel"
Source = "https://github.com/eastyou/foodlabel"

[tool.setuptools]
packages = ["foodlabel"]
